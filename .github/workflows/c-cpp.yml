name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Win32
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild rogue2/rogue2.vcxproj  /m /p:Configuration=Release /p:Platform=Win32

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path rogue2/Release/rogue2.exe -DestinationPath rogue2-win32.zip
        
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view latest-build --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload latest-build rogue2-win32.zip \
              --clobber \
              --repo "$GH_REPO"
          else
            gh release create latest-build rogue2-win32.zip \
              --title "Latest Build" \
              --notes "Latest Windows x86 build." \
              --repo "$GH_REPO"
          fi
